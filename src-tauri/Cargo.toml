[package]
name = "bunun-mazen-pharmacy"
version = "2.3.0"
description = "Bunun Mazen Pharmacy Management System"
authors = ["you"]
edition = "2021"
default-run = "bunun-mazen-pharmacy"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
dirs = "5"
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "rust_decimal", "migrate"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
rust_decimal = { version = "1.32", features = ["serde-with-str"] }
bcrypt = "0.15"
ring = "0.17"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.21"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
# Code Obfuscation - تشفير السلاسل النصية وقت البناء
obfstr = "0.4"
# subtle - بديل آمن لـ ring::constant_time (المُهمَل)
subtle = "2.5"
# Tauri Updater - نظام التحديثات التلقائية
tauri-plugin-updater = "2"
# reqwest - للبحث اللحظي في OpenFoodFacts و APIs خارجية
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# tokio-tungstenite - WebSocket server للموبايل سكانر
tokio-tungstenite = "0.24"
# qrcode - توليد QR code للإقتران
qrcode = "0.14"
# futures-util - for WebSocket stream splitting
futures-util = "0.3"
# rcgen - توليد شهادات self-signed لـ HTTPS (لتفعيل الكاميرا على الموبايل)
rcgen = "0.13"
# tokio-rustls - TLS server لـ HTTPS/WSS
tokio-rustls = "0.26"
# rustls - مكتبة TLS الأساسية (مع تفعيل ring كـ crypto provider)
rustls = { version = "0.23", features = ["ring"] }
# rustls-pki-types - أنواع الشهادات
rustls-pki-types = "1"
# tokio-util - CancellationToken لإيقاف سيرفر الموبايل
tokio-util = "0.7"
# thiserror - أنواع أخطاء موحّدة
thiserror = "1.0"
# ed25519-dalek - توقيع ترخيص بمفتاح غير متماثل
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# clap - أدوات سطر الأوامر (لأدوات توليد التراخيص)
clap = { version = "4.5", features = ["derive"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# P2 fix: optimized release profile
# - lto = "fat" — full link-time optimization across all crates (~10-15% smaller binary, slower build)
# - codegen-units = 1 — better optimization at the cost of compile time
# - strip = true — strip debug symbols from binary (~30% smaller)
# - panic = "abort" — smaller binary, no unwinding overhead (acceptable for desktop app)
[profile.release]
opt-level = "s"       # optimize for size (vs "z" which is more aggressive)
lto = "fat"           # full LTO across all dependencies
codegen-units = 1     # single codegen unit for best optimization
strip = true          # strip debug symbols
panic = "abort"       # no unwinding — smaller binary

# P2 fix: optimized dev profile for faster iteration
[profile.dev]
opt-level = 0         # no optimization — fastest compile
debug = true          # keep debug symbols
split-debuginfo = "unpacked"  # faster linking on Windows
